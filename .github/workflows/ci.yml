name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - run: python -m unittest discover -s tests -v
      - run: python run.py --once > /tmp/lifeloop-demo.json
      - run: python -m json.tool /tmp/lifeloop-demo.json > /dev/null
